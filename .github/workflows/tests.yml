name: tests

on:
  push:
  pull_request:

jobs:
  minitest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Run all tests
        run: ruby -w test/all_tests.rb
